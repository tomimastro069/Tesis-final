        <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
      </marker>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
      </marker>
      <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
      </marker>
      <style>
        .halo-text {
          paint-order: stroke fill;
          stroke: #ffffff;
          stroke-width: 4px;
          stroke-linejoin: round;
        }
      </style>
    </defs>
    <rect width="1440" height="960" fill="#ffffff"/><rect x="15" y="15" width="1410" height="930" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(40, 42)">
      <rect x="0" y="-18" width="6" height="26" rx="3" fill="#2563eb"/>
      <text x="16" y="2" font-size="18" font-weight="bold" fill="#0f172a">Diagrama de Secuencia UML — Ciclo de Vida de POST /scan</text>
      <text x="16" y="20" font-size="12" fill="#64748b">Desacoplamiento asíncrono HTTP (FastAPI), ejecución secuencial multicapa (ZAP, ffuf, SQLMap), persistencia y SOAR (n8n)</text>
    </g>
