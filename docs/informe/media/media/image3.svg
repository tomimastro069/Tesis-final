      <text x="0" y="4" font-size="10.5" font-weight="bold" fill="#475569" text-anchor="middle">Fase de Escaneo en Segundo Plano (4 a 14 min según caché)</text>
    </g>
    
    <line x1="632" y1="335" x2="798" y2="335" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
    <text class="halo-text" x="715" y="328" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">5. iniciar_spider(target) / esperar</text>
    <line x1="798" y1="357" x2="632" y2="357" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
    <text class="halo-text" x="715" y="352" font-size="10" fill="#475569" text-anchor="middle">URLs descubiertas (árbol web)</text>
    
    <line x1="632" y1="390" x2="968" y2="390" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
    <text class="halo-text" x="800" y="383" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">6. run_ffuf(target, wordlist)</text>
    <line x1="968" y1="412" x2="632" y2="412" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
    <text class="halo-text" x="800" y="407" font-size="10" fill="#475569" text-anchor="middle">rutas descubiertas por fuerza bruta</text>
    
    <line x1="632" y1="445" x2="798" y2="445" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
    <text class="halo-text" x="715" y="438" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">7. agregar_urls_a_zap(rutas_ffuf)</text>
    
    <line x1="632" y1="485" x2="798" y2="485" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
    <text class="halo-text" x="715" y="478" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">8. iniciar_escaneo_activo() / esperar</text>
    <line x1="798" y1="507" x2="632" y2="507" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
    <text class="halo-text" x="715" y="502" font-size="10" fill="#475569" text-anchor="middle">alertas y vulnerabilidades DAST</text>
    
    <line x1="632" y1="550" x2="1138" y2="550" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
    <text class="halo-text" x="885" y="543" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">9. run_sqlmap_batch(urls_candidatas, --threads=5)</text>
    <line x1="1138" y1="572" x2="632" y2="572" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
    <text class="halo-text" x="885" y="567" font-size="10" fill="#475569" text-anchor="middle">vulnerabilidades SQLi confirmadas y tablas extraídas</text>
    
    <line x1="618" y1="618" x2="452" y2="618" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <text class="halo-text" x="535" y="611" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">10. save_scan_results() / save_vulnerable_url()</text>
    
    <!-- Caja del Loop Polling (Paso 13) -->
    <g>
      <rect x="75" y="665" width="405" height="130" rx="6" fill="#f8fafc" fill-opacity="0.9" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,3"/>
