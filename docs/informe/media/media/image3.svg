    <line x1="282" y1="875" x2="1328" y2="875" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text class="halo-text" x="805" y="867" font-size="11.5" font-weight="bold" fill="#6d28d9" text-anchor="middle">15. Webhook HTTP POST callback_url (scan_id, reportes técnicos/ejecutivos, estado)</text>
    <line x1="1328" y1="895" x2="282" y2="895" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-return)"/>
    <text class="halo-text" x="805" y="891" font-size="10" fill="#64748b" text-anchor="middle">200 OK (disparo de flujos de mitigación automatizada en n8n)</text>
