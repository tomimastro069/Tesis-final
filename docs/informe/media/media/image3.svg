    <line x1="112" y1="175" x2="268" y2="175" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <text class="halo-text" x="190" y="168" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">1. POST /scan (target, nivel, cookies)</text>
    
    <line x1="282" y1="205" x2="438" y2="205" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow-solid)"/>
    <text class="halo-text" x="360" y="198" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">2. create_scan(scan_id, target)</text>
    
    <line x1="282" y1="250" x2="618" y2="250" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
    <text class="halo-text" x="450" y="242" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">3. add_task(ejecutar_pipeline_segundo_plano)</text>
    
    <line x1="268" y1="285" x2="112" y2="285" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-blue-ret)"/>
    <text class="halo-text" x="190" y="278" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">4. 202 Accepted {scan_id, status}</text>
    
