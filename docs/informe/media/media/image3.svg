      <path d="M 75 665 L 205 665 L 220 679 L 205 689 L 75 689 Z" fill="#0284c7"/>
      <text x="140" y="681" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">13. loop [polling]</text>
      <text x="235" y="682" font-size="10.5" font-style="italic" fill="#0369a1">Consultas periódicas cada 3 a 5 seg</text>
    </g>
    
    <line x1="112" y1="710" x2="268" y2="710" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
